name: Build Linux Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Release Bundle & .deb Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux tar.gz bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../sakeenah-linux-x64.tar.gz .
          cd -

      - name: Build Debian/Ubuntu .deb package
        run: |
          chmod +x scripts/build_linux_deb.sh
          ./scripts/build_linux_deb.sh

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakeenah-linux-x64-tar
          path: sakeenah-linux-x64.tar.gz

      - name: Upload Debian .deb Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakeenah-debian-package
          path: build/*.deb
